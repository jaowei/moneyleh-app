pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx --bun @biomejs/biome check --write {staged_files} 
      stage_fixed: true
